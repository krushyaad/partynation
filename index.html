<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Party Nation</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Party Nation - Jamaica's Social Party Platform">
    
    <!-- Open Graph for sharing -->
    <meta property="og:title" content="Party Nation">
    <meta property="og:description" content="Jamaica's Social Party Platform">
    <meta property="og:image" content="nation/party-nation-square.png">
    <meta property="og:url" content="https://partynation.app">
    <meta property="og:type" content="website">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    
    <!-- Preload critical resources -->
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://firestore.googleapis.com">
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
    
    <!-- Core Styles -->
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- Firebase (loaded async) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-black text-white min-h-screen">
    <!-- App Shell - Shows immediately -->
    <div id="app-shell">
        <div class="fixed inset-0 flex items-center justify-center bg-black z-50" id="splash-screen">
            <div class="text-center">
                <img src="nation/party-nation-square.png" alt="Party Nation" class="w-24 h-24 mx-auto mb-4 animate-pulse">
                <h1 class="text-2xl font-black italic text-white">PARTY NATION</h1>
                <div class="mt-4">
                    <div class="w-8 h-8 border-2 border-yellow-400 border-t-transparent rounded-full animate-spin mx-auto"></div>
                </div>
                <p class="text-white/40 text-sm mt-2" id="load-status">Loading...</p>
            </div>
        </div>
    </div>
    
    <!-- Main App Container -->
    <div id="app-root"></div>
    
    <!-- Core Scripts -->
    <script src="js/config.js"></script>
    <script src="js/router.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/core.js"></script>
    
    <!-- React (loaded after shell displays) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Load Components -->
    <script type="text/babel" src="js/components/MusicPlayer.js"></script>
    <script type="text/babel" src="js/components/DropCard.js"></script>
    <script type="text/babel" src="js/components/QuickFlix.js"></script>
    <script type="text/babel" src="js/components/CreateDropModal.js"></script>
    <script type="text/babel" src="js/components/Comments.js"></script>
    <script type="text/babel" src="js/components/KrushCoins.js"></script>
    <script type="text/babel" src="js/components/BoostPost.js"></script>
    <script type="text/babel" src="js/components/Notifications.js"></script>
    <script type="text/babel" src="js/components/Verification.js"></script>
    <script type="text/babel" src="js/components/AdminPanel.js"></script>
    <script type="text/babel" src="js/components/HomeFeed.js"></script>
    <script type="text/babel" src="js/components/TrendingFeed.js"></script>
    <script type="text/babel" src="js/components/ProfileTab.js"></script>
    <script type="text/babel" src="js/components/EventsTab.js"></script>
    
    <!-- App Entry Point (must be last) -->
    <script type="text/babel" src="js/app.js"></script>
</body>
</html>
